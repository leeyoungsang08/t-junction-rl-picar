# Training data beyond the real fleet (v16+). Real course: 2-6 cars as before (the deployment condition).
# Large map (map_builder.MAP_SCALES, 2.5x loop and connector, same junction): 8-50 cars, up to ~2.5x its
# saturation point (~30 cars). About 1/3 of training episodes stay on the real course.
# "alternating" (demand pattern switching mid-episode) is held out for testing on both maps.
scenarios:
  train:
    - {map: real, cars: [2, 3, 4, 5, 6], bias: uniform}
    - {map: real, cars: [3, 4, 5, 6], bias: west_heavy}
    - {map: real, cars: [3, 4, 5, 6], bias: connector_heavy}
    - {map: real, cars: [3, 4, 5, 6], bias: east_heavy}
    - {map: large, cars: [8, 14, 20, 26, 32, 40, 50], bias: uniform}
    - {map: large, cars: [8, 14, 20, 26, 32, 40, 50], bias: west_heavy}
    - {map: large, cars: [8, 14, 20, 26, 32, 40, 50], bias: connector_heavy}
    - {map: large, cars: [8, 14, 20, 26, 32, 40, 50], bias: east_heavy}
  validation:
    - {map: real, cars: [6], bias: uniform}
    - {map: real, cars: [6], bias: east_heavy}
    - {map: real, cars: [4], bias: connector_heavy}
    - {map: large, cars: [16], bias: uniform}
    - {map: large, cars: [28], bias: west_heavy}
    - {map: large, cars: [36], bias: connector_heavy}
    - {map: large, cars: [44], bias: east_heavy}
  test:
    - {map: real, cars: [6], bias: uniform}
    - {map: real, cars: [6], bias: connector_heavy}
    - {map: real, cars: [5], bias: alternating}
